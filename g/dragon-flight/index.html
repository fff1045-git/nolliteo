<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>드래곤 비행</title>
<meta name="theme-color" content="#1A1033">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../../assets/icons/dragon-flight-192.png">
<link rel="apple-touch-icon" href="../../assets/icons/dragon-flight-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="드래곤 비행">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #1A1033; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .bar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; display: flex; gap: 8px; z-index: 5; }
  .bar a, .bar button { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border: 3px solid #1A1033; border-radius: 999px; background: #fff; color: #1A1033; font: 16px Jua, sans-serif; text-decoration: none; box-shadow: 0 3px 0 #000; cursor: pointer; }
  .bar button { background: #FFD23F; }
  .bar [hidden] { display: none; }
</style>
</head>
<body>
<iframe sandbox="allow-scripts" src="../../games/dragon-flight/index.html" title="드래곤 비행"></iframe>
<div class="bar">
  <a href="../../index.html#/game/dragon-flight" aria-label="놀이터로 가기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>놀이터
  </a>
  <button id="install" hidden>앱 설치</button>
</div>
<script type="module">
  // 게임별 홈 화면 런처 — 열리자마자 풀스크린으로 게임 실행, 저장은 놀이터와 같은 저장소 사용
  import { createHost } from '../../js/host.js';
  import { checkIn } from '../../js/store.js';
  checkIn();
  const iframe = document.querySelector('iframe');
  createHost({ iframe, slug: 'dragon-flight' });
  iframe.addEventListener('load', () => iframe.focus());

  // 앱처럼 실행 중이면 놀이터 버튼을 작게 숨김
  const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
  const bar = document.querySelector('.bar');
  if (standalone) bar.style.opacity = '.55';

  // 안드로이드 크롬: 설치 창
  let deferred = null;
  const btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice.catch(() => {});
    deferred = null; btn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { btn.hidden = true; });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../../sw.js', { scope: '../../' }).catch(() => {});
</script>
</body>
</html>
