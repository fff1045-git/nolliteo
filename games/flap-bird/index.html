<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>파닥 버드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Noto+Sans+KR:wght@700&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: var(--bg); }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  .ui { position: fixed; font-family: var(--font); }
  #sound { top: max(10px, env(safe-area-inset-top)); right: 10px; width: 44px; height: 44px; border-radius: 50%; border: var(--btn-border); background: rgba(0,0,0,.18); color: #fff; display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 2; }
  #over { inset: 0; display: none; place-items: center; background: var(--scrim); z-index: 3; }
  #over.on { display: grid; }
  .panel { width: min(84vw, 340px); background: var(--panel); color: var(--panel-text); border: var(--panel-border); border-radius: 26px; box-shadow: var(--panel-shadow); padding: 24px 20px 20px; text-align: center; animation: pop .25s ease-out; }
  .panel h2 { margin: 0; font-weight: 400; font-size: 30px; }
  .panel .s { font-size: 56px; color: var(--accent2); line-height: 1.1; margin: 8px 0 2px; }
  .panel .b { font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); }
  .panel .new { display: inline-block; margin-top: 8px; padding: 2px 12px; border-radius: 999px; background: var(--good); color: #1A1033; }
  .panel button { margin-top: 18px; width: 100%; min-height: 56px; border: var(--btn-border); border-radius: var(--btn-radius); background: var(--btn); box-shadow: var(--btn-shadow); font: inherit; font-size: 21px; color: var(--btn-text); cursor: pointer; }
  .panel button:active { transform: translateY(2px) scale(.98); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c" aria-label="파닥 버드 게임 화면 — 탭하거나 스페이스를 누르면 날아올라요"></canvas>
<button id="sound" class="ui" aria-label="소리 끄기"></button>
<div id="over" class="ui" role="dialog" aria-label="게임 결과">
  <div class="panel">
    <h2>쿵! 부딪혔어요</h2>
    <div class="s" id="finalScore">0</div>
    <div class="b" id="finalBest">최고 기록 0</div>
    <div id="newBest"></div>
    <button id="again">다시 날기</button>
  </div>
</div>
<script src="../../sdk/playground-sdk.js" data-game="flap-bird"></script>
<script>
(() => {
  'use strict';
  // ---------- 테마 (1안 candy / 2안 neon) ----------
  const THEME_NAME = 'candy';
  const THEMES = {
    candy: {
      font: 'Jua', neon: false, ink: '#1A1033',
      sky: ['#4CC9F0', '#9BE3FF'], hill: '#2EE6A6', hill2: '#7CF0C8', ground: '#FFD23F', ground2: '#FF8C42',
      pipe: '#2EE6A6', pipeDark: '#18B985', bird: '#FFD23F', wing: '#FF8C42', beak: '#FF5DA2', cloud: '#FFFFFF', score: '#FFFFFF',
      css: { '--bg': '#4CC9F0', '--font': 'Jua, sans-serif', '--scrim': 'rgba(26,16,51,.6)', '--panel': '#fff', '--panel-text': '#1A1033', '--panel-border': '3px solid #1A1033',
        '--panel-shadow': '0 6px 0 #1A1033', '--accent2': '#6C4CF5', '--muted': '#5A4F7A', '--good': '#2EE6A6', '--btn': '#FFD23F', '--btn-text': '#1A1033', '--btn-border': '3px solid #1A1033',
        '--btn-radius': '18px', '--btn-shadow': '0 4px 0 #1A1033' },
    },
    neon: {
      font: 'Black Han Sans', neon: true, ink: 'rgba(6,4,20,.7)',
      sky: ['#0B0A1F', '#2A1460'], hill: '#1A1745', hill2: '#241F5C', ground: '#14122E', ground2: '#8B5CFF',
      pipe: '#22E1FF', pipeDark: '#0E8FB8', bird: '#FFC23D', wing: '#FF7A3D', beak: '#FF3DA8', cloud: 'rgba(255,255,255,.7)', score: '#FFFFFF',
      css: { '--bg': '#0B0A1F', '--font': '"Black Han Sans", sans-serif', '--scrim': 'rgba(5,4,16,.7)', '--panel': 'rgba(24,21,56,.94)', '--panel-text': '#F4F2FF', '--panel-border': '1.5px solid rgba(123,92,255,.7)',
        '--panel-shadow': '0 0 40px rgba(123,92,255,.45)', '--accent2': '#FFFFFF', '--muted': '#A9A3D1', '--good': '#B8FF3D', '--btn': 'linear-gradient(135deg,#7B5CFF,#FF3DA8)', '--btn-text': '#fff',
        '--btn-border': '1px solid rgba(255,255,255,.25)', '--btn-radius': '999px', '--btn-shadow': '0 0 22px rgba(255,61,168,.5)' },
    },
  };
  const T = THEMES[THEME_NAME];
  Object.entries(T.css).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  const FONT = `'${T.font}', sans-serif`;

  // ---------- 세계 (높이 H 기준 비율 → 세로·가로 화면 모두 같은 난이도) ----------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, U = 1, groundY = 0;
  const G = 2.6, FLAP = -0.78, SPEED = 0.36, GAP = 0.27, SPACING = 0.62, PIPE_W = 0.13; // 단위: 높이 H 배수 / 초
  let state = 'ready';                 // ready → play → dead
  let bird, pipes, score = 0, best = 0, scroll = 0, deadAt = 0, started = false, flashT = 0;

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = H;                                     // 1 단위 = 화면 높이
    groundY = H * .88;
    bgCache = null;
  }
  function reset() {
    bird = { x: Math.min(W * .3, H * .35), y: H * .45, vy: 0, r: H * .028, flap: 0 };
    pipes = []; score = 0; scroll = 0; state = 'ready';
    document.getElementById('over').classList.remove('on');
    PG.score(0);
  }
  function spawnPipe(x) {
    const top = H * .12, bottom = groundY - H * .1;
    const gap = GAP * U, cy = top + gap / 2 + Math.random() * (bottom - top - gap);
    pipes.push({ x, cy, gap, passed: false });
  }
  function flap() {
    if (state === 'dead') return;
    if (state === 'ready') {
      state = 'play';
      if (!started) { started = true; PG.gameStart(); }
      for (let i = 0; i < 6; i++) spawnPipe(W + H * .3 + i * SPACING * U);
    }
    bird.vy = FLAP * U; bird.flap = 1;
    beep(620, .06, 'triangle', .04);
  }
  function die() {
    if (state === 'dead') return;
    state = 'dead'; deadAt = performance.now(); flashT = 1;
    beep(160, .3, 'sawtooth', .06); PG.vibrate(40);
    const isNew = score > best;
    if (isNew) best = score;
    PG.save({ best });
    PG.gameOver(score);
    started = false;
    setTimeout(() => {
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalBest').textContent = `최고 기록 ${best}`;
      document.getElementById('newBest').innerHTML = isNew && score > 0 ? '<span class="new">최고 기록 달성!</span>' : '';
      document.getElementById('over').classList.add('on');
      document.getElementById('again').focus();
    }, 700);
  }

  let paused = false;
  PG.onPause(() => { paused = true; });
  PG.onResume(() => { paused = false; last = performance.now(); });
  function update(dt) {
    if (paused) return;
    if (state === 'ready') { bird.y = H * .45 + Math.sin(performance.now() / 260) * H * .012; scroll += SPEED * U * dt * .6; return; }
    bird.vy += G * U * dt;
    bird.y += bird.vy * dt;
    bird.flap = Math.max(0, bird.flap - dt * 4);
    if (state === 'play') {
      const dx = SPEED * U * dt;
      scroll += dx;
      for (const p of pipes) {
        p.x -= dx;
        if (!p.passed && p.x + PIPE_W * U / 2 < bird.x) { p.passed = true; score++; PG.score(score); beep(880, .07, 'square', .04); }
      }
      if (pipes.length && pipes[0].x < -PIPE_W * U) { pipes.shift(); spawnPipe(pipes[pipes.length - 1].x + SPACING * U); }
      // 충돌 (원 vs 사각형)
      const r = bird.r * .82, pw = PIPE_W * U / 2;
      for (const p of pipes) {
        if (Math.abs(p.x - bird.x) > pw + r) continue;
        const inGap = bird.y - r > p.cy - p.gap / 2 && bird.y + r < p.cy + p.gap / 2;
        if (!inGap) { die(); break; }
      }
      if (bird.y - r < 0) { bird.y = r; bird.vy = 0; }
    }
    if (bird.y + bird.r > groundY) { bird.y = groundY - bird.r; bird.vy = 0; die(); }
  }

  // ---------- 그리기 ----------
  let bgCache = null;
  function drawSky() {
    if (!bgCache) {
      bgCache = document.createElement('canvas'); bgCache.width = cv.width; bgCache.height = cv.height;
      const b = bgCache.getContext('2d'); b.scale(DPR, DPR);
      const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      if (T.neon) {
        for (let i = 0; i < 70; i++) { b.globalAlpha = .2 + (i % 5) * .12; b.fillStyle = '#fff'; b.beginPath(); b.arc((i * 137.5) % W, (i * 71.3) % (H * .7), (i % 3) * .5 + .6, 0, 7); b.fill(); }
        b.globalAlpha = 1;
        const a = b.createRadialGradient(W * .8, H * .15, 0, W * .8, H * .15, H * .6); a.addColorStop(0, 'rgba(255,61,168,.28)'); a.addColorStop(1, 'rgba(255,61,168,0)');
        b.fillStyle = a; b.fillRect(0, 0, W, H);
      }
    }
    ctx.drawImage(bgCache, 0, 0, W, H);
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function layer(speed, color, base, amp, wave, buildings) {
    const off = (scroll * speed) % (wave * 2);
    ctx.fillStyle = color;
    if (buildings) {
      for (let x = -off; x < W + wave; x += wave * .5) {
        const h = amp * (.4 + ((Math.floor((x + off) / (wave * .5)) * 7919) % 10) / 10);
        ctx.fillRect(x, base - h, wave * .42, h + H);
      }
      return;
    }
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = -off; x <= W + wave * 2; x += 8) ctx.lineTo(x, base - Math.sin((x + off) / wave * Math.PI) * amp - amp);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  function clouds() {
    if (T.neon) return;
    ctx.fillStyle = T.cloud;
    for (let i = 0; i < 5; i++) {
      const x = ((i * 0.43 * W + W) - (scroll * .15) % (W * 1.4) + W * 1.4) % (W * 1.4) - W * .2, y = H * (.12 + (i % 3) * .1), s = H * (.035 + (i % 2) * .015);
      ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.arc(x + s, y - s * .4, s * 1.2, 0, 7); ctx.arc(x + s * 2.1, y, s, 0, 7); ctx.fill();
    }
  }
  function pipe(p) {
    const w = PIPE_W * U, x = p.x - w / 2, lip = H * .022, lw = w * 1.14, lx = p.x - lw / 2;
    const top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
    for (const [y, h, ly] of [[-10, top + 10, top - lip], [bot, groundY - bot, bot]]) {
      if (T.neon) { ctx.shadowColor = T.pipe; ctx.shadowBlur = 16; }
      ctx.fillStyle = T.neon ? 'rgba(34,225,255,.16)' : T.pipe;
      ctx.fillRect(x, y, w, h);
      ctx.lineWidth = T.neon ? 2 : 3; ctx.strokeStyle = T.neon ? T.pipe : T.ink; ctx.strokeRect(x, y, w, h);
      rr(lx, ly, lw, lip, 4); ctx.fillStyle = T.neon ? 'rgba(34,225,255,.35)' : T.pipeDark; ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      if (!T.neon) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + w * .14, y + 4, w * .12, Math.max(0, h - 8)); }
    }
  }
  function drawBird() {
    const { x, y, r } = bird;
    const ang = Math.max(-.5, Math.min(1.2, bird.vy / (U * 1.4)));
    ctx.save(); ctx.translate(x, y); ctx.rotate(state === 'ready' ? 0 : ang);
    if (T.neon) { ctx.shadowColor = T.bird; ctx.shadowBlur = 18; }
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r, 0, 0, 7); ctx.fillStyle = T.bird; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(2, r * .14); ctx.strokeStyle = T.ink; ctx.stroke();
    // 날개 (파닥)
    const wy = r * (.15 - bird.flap * .55 + Math.sin(performance.now() / 70) * (state === 'ready' ? .2 : 0));
    ctx.beginPath(); ctx.ellipse(-r * .35, wy, r * .55, r * .32, -.3, 0, 7); ctx.fillStyle = T.wing; ctx.fill(); ctx.stroke();
    // 눈 · 부리
    ctx.beginPath(); ctx.arc(r * .42, -r * .3, r * .3, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * .5, -r * .28, r * .13, 0, 7); ctx.fillStyle = '#1A1033'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(r * .85, r * .02); ctx.lineTo(r * 1.45, r * .18); ctx.lineTo(r * .85, r * .38); ctx.closePath(); ctx.fillStyle = T.beak; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function text(t, x, y, size, color) {
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (T.neon) { ctx.shadowColor = 'rgba(34,225,255,.9)'; ctx.shadowBlur = 16; }
    ctx.lineWidth = Math.max(4, size * .14); ctx.strokeStyle = T.neon ? '#0B0A1F' : T.ink; ctx.strokeText(t, x, y);
    ctx.shadowBlur = 0; ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function draw() {
    drawSky(); clouds();
    layer(.2, T.hill2, groundY - H * .08, H * .05, H * .55, T.neon);
    layer(.45, T.hill, groundY - H * .02, H * .035, H * .35, false);
    pipes.forEach(pipe);
    // 땅
    ctx.fillStyle = T.ground; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = T.ground2;
    const stripe = H * .05, off = scroll % (stripe * 2);
    for (let x = -off; x < W; x += stripe * 2) { ctx.beginPath(); ctx.moveTo(x, groundY + H * .025); ctx.lineTo(x + stripe, groundY + H * .025); ctx.lineTo(x + stripe * .6, groundY + H * .045); ctx.lineTo(x - stripe * .4, groundY + H * .045); ctx.fill(); }
    ctx.fillRect(0, groundY, W, Math.max(2, H * .006));
    drawBird();
    const s = Math.round(Math.min(64, H * .085));
    if (state !== 'ready') text(String(score), W / 2, H * .14, s, T.score);
    else {
      text('파닥 버드', W / 2, H * .2, Math.round(s * .85), T.neon ? '#fff' : '#FFD23F');
      text(`탭 · 클릭 · 스페이스로 날기`, W / 2, H * .66, Math.round(s * .38), '#fff');
      if (best) text(`최고 ${best}`, W / 2, H * .72, Math.round(s * .34), T.neon ? '#B8FF3D' : '#FFD23F');
    }
    if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * .6})`; ctx.fillRect(0, 0, W, H); flashT = Math.max(0, flashT - .08); }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- 입력 ----------
  cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') { e.preventDefault(); if (state === 'dead' && performance.now() - deadAt > 800) reset(); else flap(); } });
  document.getElementById('again').addEventListener('click', reset);

  // ---------- 소리 ----------
  let ac = null, muted = false;
  function beep(freq, dur = .08, type = 'square', vol = .05) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const soundBtn = document.getElementById('sound');
  const drawSoundIcon = () => {
    soundBtn.innerHTML = muted
      ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9.5l5 5M21 9.5l-5 5"/></svg>'
      : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
    soundBtn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
  };
  soundBtn.addEventListener('pointerdown', e => e.stopPropagation());
  soundBtn.addEventListener('click', () => { muted = !muted; drawSoundIcon(); });
  drawSoundIcon();

  // ---------- 시작 ----------
  window.addEventListener('resize', () => { layout(); if (state !== 'play') reset(); });
  layout(); reset();
  requestAnimationFrame(frame);
  PG.load().then(save => { if (save && typeof save.best === 'number') best = save.best; PG.ready(); });
  window.__flap = { get state() { return state; }, get score() { return score; }, get bird() { return bird; }, get pipes() { return pipes; }, flap };
})();
</script>
</body>
</html>
