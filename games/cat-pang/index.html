<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>캣팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #FFE9A8; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  .ui { position: fixed; font-family: Jua, sans-serif; color: #1A1033; }
  #sound { top: max(10px, env(safe-area-inset-top)); right: 10px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #1A1033; background: #fff; display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 2; }
  .ov { inset: 0; display: none; place-items: center; background: rgba(26,16,51,.55); z-index: 3; }
  .ov.on { display: grid; }
  .panel { width: min(84vw, 340px); background: #fff; border: 3px solid #1A1033; border-radius: 26px; box-shadow: 0 6px 0 #1A1033; padding: 22px 20px 20px; text-align: center; animation: pop .25s ease-out; }
  .panel img { width: 86px; height: 86px; }
  .panel h2 { margin: 6px 0 0; font-weight: 400; font-size: 30px; }
  .panel p { font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 14px; color: #5A4F7A; margin: 8px 0 0; line-height: 1.5; }
  .panel .s { font-size: 54px; color: #6C4CF5; line-height: 1.1; margin-top: 6px; }
  .panel .new { display: inline-block; margin-top: 8px; padding: 2px 12px; border-radius: 999px; background: #FF5DA2; color: #fff; }
  .panel button { margin-top: 16px; width: 100%; min-height: 56px; border: 3px solid #1A1033; border-radius: 18px; background: #FFD23F; box-shadow: 0 4px 0 #1A1033; font: inherit; font-size: 22px; color: #1A1033; cursor: pointer; }
  .panel button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1A1033; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c" aria-label="캣팡 게임 판 — 고양이를 옆으로 밀어 같은 고양이 3마리를 맞춰요"></canvas>
<button id="sound" class="ui" aria-label="소리 끄기"></button>
<div id="ready" class="ui ov on" role="dialog" aria-label="시작">
  <div class="panel">
    <img src="img/cat-1.webp" alt="">
    <h2>캣팡</h2>
    <p>고양이를 옆 칸으로 밀어서<br>같은 고양이 3마리를 한 줄로 맞춰요.<br>빠르게 이어 맞추면 콤보! · 60초</p>
    <button id="start">시작하기</button>
  </div>
</div>
<div id="over" class="ui ov" role="dialog" aria-label="게임 결과">
  <div class="panel">
    <h2>타임 오버!</h2>
    <div class="s" id="finalScore">0</div>
    <p id="finalSub">최고 콤보 0 · 최고 기록 0</p>
    <div id="newBest"></div>
    <button id="again">한 판 더</button>
  </div>
</div>
<script src="../../sdk/playground-sdk.js" data-game="cat-pang"></script>
<script>
(() => {
  'use strict';
  const N = 7, KINDS = 6, TIME = 60, INK = '#1A1033';
  const BG = ['#FFB27A', '#3D3557', '#E8F4FF', '#B8C4D6', '#FFE0B8', '#E8D2B8'];   // 고양이 뒤 타일 색
  const cats = Array.from({ length: KINDS }, (_, i) => { const im = new Image(); im.src = `img/cat-${i + 1}.webp`; return im; });

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, DPR, L = {};
  let grid;                     // grid[r][c] = { k, bomb, id, y(표시 위치) } | null
  let state = 'ready', score = 0, best = 0, timeLeft = TIME, combo = 0, maxCombo = 0, lastMatch = 0, fever = 0;
  let busy = false, sel = null, drag = null, idle = 0, hint = null, paused = false, nextId = 1;
  const fx = [];

  // ---------- 판 ----------
  const cell = () => ({ k: Math.floor(Math.random() * KINDS), bomb: false, id: nextId++, y: -1, dy: 0 });
  function fresh() {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let t;
      do { t = cell(); } while ((c >= 2 && grid[r][c - 1].k === t.k && grid[r][c - 2].k === t.k) || (r >= 2 && grid[r - 1][c].k === t.k && grid[r - 2][c].k === t.k));
      t.y = r - N - 1; grid[r][c] = t;
    }
    if (!findMove()) fresh();
  }
  function runs() {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
      let e = c; while (e + 1 < N && grid[r][e + 1] && grid[r][c] && grid[r][e + 1].k === grid[r][c].k) e++;
      if (grid[r][c] && e - c + 1 >= 3) out.push({ cells: Array.from({ length: e - c + 1 }, (_, i) => [r, c + i]) });
      c = e + 1;
    }
    for (let c = 0; c < N; c++) for (let r = 0; r < N;) {
      let e = r; while (e + 1 < N && grid[e + 1][c] && grid[r][c] && grid[e + 1][c].k === grid[r][c].k) e++;
      if (grid[r][c] && e - r + 1 >= 3) out.push({ cells: Array.from({ length: e - r + 1 }, (_, i) => [r + i, c]) });
      r = e + 1;
    }
    return out;
  }
  function swapCells(a, b) { const t = grid[a[0]][a[1]]; grid[a[0]][a[1]] = grid[b[0]][b[1]]; grid[b[0]][b[1]] = t; }
  function findMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
      swapCells([r, c], [r2, c2]); const ok = runs().length > 0; swapCells([r, c], [r2, c2]);
      if (ok) return [[r, c], [r2, c2]];
    }
    return null;
  }

  // ---------- 맞추기 진행 ----------
  const wait = ms => new Promise(res => setTimeout(res, ms));
  async function trySwap(a, b) {
    if (busy || state !== 'play') return;
    busy = true; sel = null; hint = null; idle = 0;
    const A = grid[a[0]][a[1]], B = grid[b[0]][b[1]];
    swapAnim(a, b); swapCells(a, b); await wait(130);
    if (A.bomb || B.bomb || runs().length) await resolve(b, a);
    else { beep(200, .08, 'triangle', .04); swapAnim(a, b); swapCells(a, b); await wait(130); }
    busy = false;
    if (!findMove()) { say('섞는 중!'); await shuffle(); }
  }
  function swapAnim(a, b) {
    const A = grid[a[0]][a[1]], B = grid[b[0]][b[1]];
    A.ox = (a[1] - b[1]); A.oy = (a[0] - b[0]); B.ox = (b[1] - a[1]); B.oy = (b[0] - a[0]);
    // 바뀐 자리로 미끄러지듯 (ox/oy 를 0으로 줄여 감)
    A.slide = B.slide = 1;
  }
  async function resolve(swapA, swapB) {
    let first = true;
    for (;;) {
      const rs = runs();
      const bombs = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]?.bomb && (first && ((r === swapA[0] && c === swapA[1]) || (r === swapB[0] && c === swapB[1])))) bombs.push([r, c]);
      if (!rs.length && !bombs.length) break;
      const kill = new Set(), newBomb = [];
      for (const run of rs) {
        run.cells.forEach(([r, c]) => kill.add(r * N + c));
        if (run.cells.length >= 4) {   // 4개 이상 → 그 자리에 십자 폭탄 고양이
          const at = run.cells.find(([r, c]) => (r === swapA[0] && c === swapA[1]) || (r === swapB[0] && c === swapB[1])) || run.cells[1];
          newBomb.push({ at, k: grid[at[0]][at[1]].k });
        }
      }
      bombs.forEach(([r, c]) => kill.add(r * N + c));
      // 터지는 폭탄은 가로·세로 한 줄씩을 모두 지운다
      let added = true;
      while (added) {
        added = false;
        for (const k of [...kill]) {
          const r = Math.floor(k / N), c = k % N;
          if (grid[r][c]?.bomb && !grid[r][c].blown) {
            grid[r][c].blown = true; added = true;
            for (let i = 0; i < N; i++) { kill.add(r * N + i); kill.add(i * N + c); }
            fx.push({ kind: 'line', r, c, t0: performance.now(), dur: 380 });
            beep(120, .25, 'sawtooth', .05);
          }
        }
      }
      const now = performance.now();
      combo = now - lastMatch < 2200 || !first ? combo + 1 : 1;
      lastMatch = now; maxCombo = Math.max(maxCombo, combo);
      if (combo >= 10 && !fever) { fever = 6; say('피버 타임! 점수 2배'); }
      const mult = (1 + (combo - 1) * .15) * (fever > 0 ? 2 : 1);
      const gained = Math.round(kill.size * 30 * mult);
      score += gained; if (score > best) best = score; PG.score(score);
      let cx = 0, cy = 0;
      kill.forEach(k => {
        const r = Math.floor(k / N), c = k % N, t = grid[r][c]; if (!t) return;
        cx += c; cy += r;
        for (let i = 0; i < 3; i++) fx.push({ kind: 'bit', x: L.bx + (c + .5) * L.cs, y: L.by + (r + .5) * L.cs, vx: (Math.random() - .5) * 7, vy: -Math.random() * 6 - 1, s: L.cs * .14, color: BG[t.k], t0: now, dur: 650 });
        fx.push({ kind: 'pop', r, c, k: t.k, t0: now, dur: 220 });
        grid[r][c] = null;
      });
      newBomb.forEach(({ at, k }) => { const t = cell(); t.k = k; t.bomb = true; t.y = at[0]; grid[at[0]][at[1]] = t; });
      cx /= kill.size; cy /= kill.size;
      fx.push({ kind: 'text', text: `+${gained}`, x: L.bx + (cx + .5) * L.cs, y: L.by + (cy + .5) * L.cs, size: L.cs * .55, color: '#fff', t0: now, dur: 800 });
      if (combo >= 2) fx.push({ kind: 'text', text: `${combo} 콤보!`, x: W / 2, y: L.by - L.cs * .2, size: L.cs * .7, color: '#FF5DA2', t0: now, dur: 900, big: true });
      beep(523 + Math.min(combo, 12) * 60, .09, 'square', .045); PG.vibrate(kill.size > 4 ? 25 : 12);
      first = false;
      await wait(200);
      gravity();
      await wait(260);
    }
  }
  function gravity() {
    for (let c = 0; c < N; c++) {
      const col = []; for (let r = N - 1; r >= 0; r--) if (grid[r][c]) col.push(grid[r][c]);
      let miss = 0;
      for (let r = N - 1; r >= 0; r--) {
        const t = col.shift();
        if (t) grid[r][c] = t;
        else { const n = cell(); miss++; n.y = -miss; grid[r][c] = n; }
      }
    }
  }
  async function shuffle() {
    busy = true;
    const all = grid.flat();
    do { all.sort(() => Math.random() - .5); for (let i = 0; i < all.length; i++) grid[Math.floor(i / N)][i % N] = all[i]; } while (runs().length || !findMove());
    await wait(300); busy = false;
  }

  // ---------- 진행 ----------
  function start() {
    document.getElementById('ready').classList.remove('on');
    document.getElementById('over').classList.remove('on');
    score = 0; timeLeft = TIME; combo = 0; maxCombo = 0; fever = 0; sel = null; hint = null;
    fresh(); state = 'play'; PG.gameStart(); PG.score(0);
    beep(660, .1, 'square', .05);
  }
  function end() {
    state = 'over';
    const isNew = score > 0 && score >= best;
    PG.save({ best }); PG.gameOver(score);
    beep(330, .3, 'triangle', .05);
    document.getElementById('finalScore').textContent = score.toLocaleString('ko-KR');
    document.getElementById('finalSub').textContent = `최고 콤보 ${maxCombo} · 최고 기록 ${best.toLocaleString('ko-KR')}`;
    document.getElementById('newBest').innerHTML = isNew ? '<span class="new">최고 기록!</span>' : '';
    setTimeout(() => document.getElementById('over').classList.add('on'), 400);
  }
  document.getElementById('start').addEventListener('click', start);
  document.getElementById('again').addEventListener('click', start);
  PG.onPause(() => { paused = true; });
  PG.onResume(() => { paused = false; });

  // ---------- 입력: 밀기(스와이프) 또는 두 번 탭 ----------
  const at = e => { const r = cv.getBoundingClientRect(); const x = e.clientX - r.left - L.bx, y = e.clientY - r.top - L.by; const c = Math.floor(x / L.cs), rr = Math.floor(y / L.cs); return c >= 0 && rr >= 0 && c < N && rr < N ? [rr, c] : null; };
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' || busy) return;
    const p = at(e); if (!p) { sel = null; return; }
    drag = { p, x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < L.cs * .35) return;
    const [r, c] = drag.p, d = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
    const t = [r + d[0], c + d[1]]; drag = null;
    if (t[0] >= 0 && t[1] >= 0 && t[0] < N && t[1] < N) trySwap([r, c], t);
  });
  cv.addEventListener('pointerup', () => {
    if (!drag) return;
    const p = drag.p; drag = null;
    if (sel && Math.abs(sel[0] - p[0]) + Math.abs(sel[1] - p[1]) === 1) trySwap(sel, p);
    else if (sel && sel[0] === p[0] && sel[1] === p[1] && grid[p[0]][p[1]]?.bomb) trySwap(p, p);   // 폭탄 두 번 탭 → 터뜨리기
    else sel = p;
  });

  // ---------- 그리기 ----------
  function layout() {
    DPR = Math.min(devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const top = Math.max(130, H * .2), bs = Math.min(W * .94, H - top - 30, 560);
    L = { bs, cs: bs / N, bx: (W - bs) / 2, by: top + Math.max(0, (H - top - bs - 30) * .3), top };
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function text(t, x, y, size, color, stroke = 5) {
    ctx.font = `${Math.round(size)}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = stroke; ctx.strokeStyle = INK; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function drawCat(k, x, y, s, bomb, scale = 1) {
    const pad = s * .06, ss = s * scale, ox = x + (s - ss) / 2, oy = y + (s - ss) / 2;
    rr(ox + pad, oy + pad, ss - pad * 2, ss - pad * 2, ss * .22); ctx.fillStyle = BG[k]; ctx.fill();
    ctx.lineWidth = Math.max(2, s * .05); ctx.strokeStyle = INK; ctx.stroke();
    const im = cats[k];
    if (im.complete && im.naturalWidth) ctx.drawImage(im, ox + ss * .1, oy + ss * .1, ss * .8, ss * .8);
    if (bomb) {
      ctx.save(); ctx.globalAlpha = .9; ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
      for (const [w, h] of [[ss * .9, ss * .14], [ss * .14, ss * .9]]) { rr(ox + (ss - w) / 2, oy + (ss - h) / 2, w, h, 4); ctx.globalAlpha = .55; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); }
      ctx.restore();
    }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (state === 'play' && !paused) {
      timeLeft -= dt; idle += dt;
      if (fever > 0) fever = Math.max(0, fever - dt);
      if (now - lastMatch > 2200 && !busy) combo = 0;
      if (idle > 5 && !hint && !busy) hint = findMove();
      if (timeLeft <= 0 && !busy) { timeLeft = 0; end(); }
    }
    // 배경
    ctx.fillStyle = fever > 0 ? (Math.floor(now / 150) % 2 ? '#FFC8E0' : '#FFE9A8') : '#FFE9A8'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let y = 12; y < H; y += 28) for (let x = (y / 28) % 2 ? 26 : 12; x < W; x += 28) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
    // HUD
    const hy = L.top * .32;
    text(score.toLocaleString('ko-KR'), W / 2, hy, Math.min(50, W * .12), '#fff', 7);
    ctx.font = `${Math.round(Math.min(15, W * .04))}px Jua, sans-serif`; ctx.fillStyle = '#5A4F7A'; ctx.textAlign = 'center';
    ctx.fillText(`최고 ${best.toLocaleString('ko-KR')}${fever > 0 ? '   ·   피버 ×2' : ''}`, W / 2, hy + Math.min(36, H * .05));
    const bw = Math.min(W * .86, 420), bx = (W - bw) / 2, by = L.top * .72;
    rr(bx, by, bw, 18, 9); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    const k = timeLeft / TIME;
    if (k > 0) { rr(bx + 3, by + 3, Math.max(12, (bw - 6) * k), 12, 6); ctx.fillStyle = k < .2 ? '#FF5DA2' : '#2EE6A6'; ctx.fill(); }
    // 판
    rr(L.bx - 8, L.by - 8, L.bs + 16, L.bs + 16, 22); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    if (grid) {
      const pulse = (Math.sin(now / 120) + 1) / 2;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const t = grid[r][c]; if (!t) continue;
        t.y += (r - t.y) * Math.min(1, dt * 14); if (Math.abs(r - t.y) < .01) t.y = r;
        if (t.slide) { t.slide = Math.max(0, t.slide - dt * 8); }
        const ox = (t.ox || 0) * (t.slide || 0), oy = (t.oy || 0) * (t.slide || 0);
        const isSel = sel && sel[0] === r && sel[1] === c, isHint = hint && hint.some(([a, b]) => a === r && b === c);
        drawCat(t.k, L.bx + (c + ox) * L.cs, L.by + (t.y + oy) * L.cs, L.cs, t.bomb, isSel ? 1.08 : isHint ? 1 + pulse * .08 : 1);
        if (isSel) { rr(L.bx + c * L.cs + 2, L.by + r * L.cs + 2, L.cs - 4, L.cs - 4, L.cs * .22); ctx.lineWidth = 4; ctx.strokeStyle = '#FF5DA2'; ctx.stroke(); }
      }
    }
    // 이펙트
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i], p = (now - f.t0) / f.dur;
      if (p >= 1) { fx.splice(i, 1); continue; }
      if (f.kind === 'bit') { f.x += f.vx; f.y += f.vy; f.vy += .35; ctx.globalAlpha = 1 - p; ctx.fillStyle = f.color; ctx.fillRect(f.x, f.y, f.s, f.s); ctx.globalAlpha = 1; }
      else if (f.kind === 'pop') { ctx.globalAlpha = 1 - p; drawCat(f.k, L.bx + f.c * L.cs, L.by + f.r * L.cs, L.cs, false, 1 + p * .5); ctx.globalAlpha = 1; }
      else if (f.kind === 'line') { ctx.globalAlpha = 1 - p; ctx.fillStyle = '#FFD23F'; ctx.fillRect(L.bx, L.by + f.r * L.cs + L.cs * .3, L.bs, L.cs * .4); ctx.fillRect(L.bx + f.c * L.cs + L.cs * .3, L.by, L.cs * .4, L.bs); ctx.globalAlpha = 1; }
      else { ctx.save(); ctx.globalAlpha = 1 - p * p; text(f.text, f.x, f.y - p * 40, f.size * (f.big ? 1 + .2 * Math.sin(p * Math.PI) : 1), f.color, 6); ctx.restore(); }
    }
    requestAnimationFrame(frame);
  }
  function say(t) { fx.push({ kind: 'text', text: t, x: W / 2, y: L.by + L.bs / 2, size: Math.min(34, W * .08), color: '#FFD23F', t0: performance.now(), dur: 1300, big: true }); }

  // ---------- 소리 ----------
  let ac = null, muted = false;
  function beep(f, d = .08, type = 'square', v = .05) {
    if (muted) return;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {}
  }
  const sb = document.getElementById('sound');
  const icon = () => { sb.innerHTML = muted ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9.5l5 5M21 9.5l-5 5"/></svg>' : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>'; sb.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기'); };
  sb.addEventListener('click', () => { muted = !muted; icon(); }); icon();

  addEventListener('resize', layout); layout(); fresh();
  requestAnimationFrame(frame);
  PG.load().then(s => { if (s && typeof s.best === 'number') best = s.best; PG.ready(); });
  window.__cat = { get state() { return state; }, get score() { return score; }, get combo() { return combo; }, findMove, trySwap, start, get grid() { return grid.map(r => r.map(t => t && t.k)); }, set time(v) { timeLeft = v; } };
})();
